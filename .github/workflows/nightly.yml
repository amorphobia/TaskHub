name: Nightly Build

on:
  push:
    branches:
      - master
      - dev
  schedule:
    # Daily at 02:17 Asia/Shanghai (18:17 UTC), from the default branch.
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-build
  # Let an active release update finish before starting the next build.
  cancel-in-progress: false

jobs:
  nightly:
    name: Build and publish nightly .cmd
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build TaskHub.cmd
        run: ./build.ps1

      - name: Verify build output
        run: |
          $item = Get-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'TaskHub.cmd') -ErrorAction Stop
          if ($item.Length -eq 0) { throw 'Build output TaskHub.cmd is empty.' }
          Write-Host "Built $($item.FullName) ($($item.Length) bytes)."

      - name: Upload .cmd artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskHub-nightly
          path: TaskHub.cmd
          if-no-files-found: error

      - name: Publish or update nightly pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Check native exit codes explicitly, including the first-run
          # case where gh release view reports that no release exists.
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = 'nightly'
          $title = 'TaskHub nightly build'
          $commit = $env:GITHUB_SHA
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $notes = "Nightly pre-release build from $env:GITHUB_REF_NAME at commit $commit.`n`nArtifact: TaskHub.cmd - self-contained CMD/PowerShell polyglot (Windows PowerShell 5.1 + WPF).`n`nBuild: $runUrl"

          # Move only the rolling nightly tag so source archives match the binary.
          git tag --force $tag $commit
          if ($LASTEXITCODE -ne 0) { throw "git tag failed ($LASTEXITCODE)" }
          git push --force origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "git push nightly tag failed ($LASTEXITCODE)" }

          gh release view $tag --json id 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            # Reuse the same release: overwrite the asset and update metadata
            gh release upload $tag .\TaskHub.cmd --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed ($LASTEXITCODE)" }
            gh release edit $tag --prerelease --latest=false --title $title --notes $notes --target $commit
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed ($LASTEXITCODE)" }
          }
          else {
            # First run: create the nightly release
            gh release create $tag .\TaskHub.cmd --verify-tag --prerelease --latest=false --title $title --notes $notes --target $commit
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
          }
