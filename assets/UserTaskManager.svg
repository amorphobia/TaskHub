<?xml version="1.0" encoding="UTF-8"?>
<!--
  UserTaskManager icon master.
  The build uses only this deliberately small SVG subset so Windows PowerShell
  5.1 and WPF can render it without third-party libraries.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Calendar -->
  <rect x="22" y="29" width="184" height="198" rx="31"
        fill="#2563EB" stroke="#1E40AF" stroke-width="8"/>
  <path d="M38 80 H190 V196 A15 15 0 0 1 175 211 H53 A15 15 0 0 1 38 196 Z"
        fill="#EFF6FF"/>
  <line x1="40" y1="80" x2="188" y2="80"
        stroke="#93C5FD" stroke-width="7"/>

  <!-- Calendar binding rings -->
  <rect x="58" y="14" width="17" height="46" rx="8.5" fill="#DBEAFE" stroke="#1E40AF" stroke-width="6"/>
  <rect x="151" y="14" width="17" height="46" rx="8.5" fill="#DBEAFE" stroke="#1E40AF" stroke-width="6"/>

  <!-- Task list -->
  <rect x="53" y="101" width="18" height="18" rx="5" fill="#3B82F6"/>
  <path d="M57 109 L62 114 L69 105" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="82" y1="110" x2="148" y2="110" stroke="#1E3A8A" stroke-width="8" stroke-linecap="round"/>

  <rect x="53" y="136" width="18" height="18" rx="5" fill="#3B82F6"/>
  <path d="M57 144 L62 149 L69 140" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="82" y1="145" x2="139" y2="145" stroke="#1E3A8A" stroke-width="8" stroke-linecap="round"/>

  <rect x="53" y="171" width="18" height="18" rx="5" fill="#3B82F6"/>
  <path d="M57 179 L62 184 L69 175" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="82" y1="180" x2="126" y2="180" stroke="#1E3A8A" stroke-width="8" stroke-linecap="round"/>

  <!-- Clock -->
  <circle cx="181" cy="177" r="56" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="9"/>
  <circle cx="181" cy="177" r="43" fill="#FFFFFF" stroke="#60A5FA" stroke-width="4"/>
  <line x1="181" y1="177" x2="181" y2="146" stroke="#1E3A8A" stroke-width="9" stroke-linecap="round"/>
  <line x1="181" y1="177" x2="205" y2="190" stroke="#1E3A8A" stroke-width="9" stroke-linecap="round"/>
  <circle cx="181" cy="177" r="7" fill="#2563EB"/>
</svg>
